[project]
name = "testinator-connect"
version = "0.1.0"
description = "Connect local MCP servers to testinator-tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-socketio[client]>=5.0.0",
    "mcp>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
testinator-connect = "testinator_connect.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testinator_connect"]

[tool.uv]
dev-dependencies = []
