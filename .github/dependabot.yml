version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security updates only: 0 turns off the scheduled version updates, not the security ones.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        # Major updates come as separate PRs and are reviewed on their own.
        update-types: ['patch', 'minor']
        patterns: ['*']
        # Electron updates are tested by hand.
        exclude-patterns: ['electron']
