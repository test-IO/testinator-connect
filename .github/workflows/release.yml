name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm test
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}"

  release-macos:
    name: Release macOS
    needs: verify-version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download uv binaries
        run: |
          curl -sL "https://github.com/astral-sh/uv/releases/latest/download/uv-aarch64-apple-darwin.tar.gz" \
            | tar xz -C /tmp uv-aarch64-apple-darwin/uv
          mv /tmp/uv-aarch64-apple-darwin/uv resources/uv-macos-arm64

          curl -sL "https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-apple-darwin.tar.gz" \
            | tar xz -C /tmp uv-x86_64-apple-darwin/uv
          mv /tmp/uv-x86_64-apple-darwin/uv resources/uv-macos-x64

          chmod +x resources/uv-macos-arm64 resources/uv-macos-x64

      - name: Build
        env:
          AIRBRAKE_PROJECT_ID: ${{ secrets.AIRBRAKE_PROJECT_ID }}
          AIRBRAKE_PROJECT_KEY: ${{ secrets.AIRBRAKE_PROJECT_KEY }}
          # Enables the mac updater; set the repo variable once builds are Developer ID signed.
          MAIN_VITE_MAC_SIGNED: ${{ vars.MAC_SIGNING_ENABLED == 'true' && 'true' || 'false' }}
          MAIN_VITE_AUTO_UPDATE: ${{ vars.AUTO_UPDATE_ENABLED == 'false' && 'false' || 'true' }}
        run: npm run build

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx electron-builder --mac \
            --publish always \
            --config.publish.releaseType=draft

  release-windows:
    name: Release Windows
    needs: verify-version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Download uv binary
        shell: pwsh
        run: |
          $tmp = "$env:TEMP\uv-win.zip"
          Invoke-WebRequest "https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip" -OutFile $tmp
          Expand-Archive -Path $tmp -DestinationPath "$env:TEMP\uv-win" -Force
          Move-Item "$env:TEMP\uv-win\uv.exe" "resources\uv-windows-x64.exe" -Force

      - name: Build
        env:
          AIRBRAKE_PROJECT_ID: ${{ secrets.AIRBRAKE_PROJECT_ID }}
          AIRBRAKE_PROJECT_KEY: ${{ secrets.AIRBRAKE_PROJECT_KEY }}
          MAIN_VITE_AUTO_UPDATE: ${{ vars.AUTO_UPDATE_ENABLED == 'false' && 'false' || 'true' }}
        run: npm run build

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_LINK: ${{ secrets.windows_certs }}
          # CSC_KEY_PASSWORD: ${{ secrets.windows_certs_password }}
        run: |
          npx electron-builder --win `
            --publish always `
            --config.publish.releaseType=draft
        shell: pwsh

  publish:
    name: Publish release
    needs: [release-macos, release-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
