name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version and create draft
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Decide whether package.json has a new version
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          existing=$(gh release view "$tag" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          tag_exists=$([ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ] && echo true || echo false)
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          node scripts/plan-release.mjs "$existing" "$tag_exists" "$latest" >> "$GITHUB_OUTPUT"
      # The lockfile only carries the macOS rollup binary (npm/cli#4828), so ignore it on Linux.
      - if: steps.plan.outputs.release == 'true'
        run: npm install --no-package-lock
      - if: steps.plan.outputs.release == 'true'
        run: npm test
      - name: Create draft release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if [ "${{ steps.plan.outputs.recreate_draft }}" = true ]; then gh release delete "$TAG" --yes; fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "${TAG#v}"

  release-macos:
    name: Release macOS
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download uv binaries
        run: |
          curl -sL "https://github.com/astral-sh/uv/releases/latest/download/uv-aarch64-apple-darwin.tar.gz" \
            | tar xz -C /tmp uv-aarch64-apple-darwin/uv
          mv /tmp/uv-aarch64-apple-darwin/uv resources/uv-macos-arm64

          curl -sL "https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-apple-darwin.tar.gz" \
            | tar xz -C /tmp uv-x86_64-apple-darwin/uv
          mv /tmp/uv-x86_64-apple-darwin/uv resources/uv-macos-x64

          chmod +x resources/uv-macos-arm64 resources/uv-macos-x64

      - name: Build
        env:
          AIRBRAKE_PROJECT_ID: ${{ secrets.AIRBRAKE_PROJECT_ID }}
          AIRBRAKE_PROJECT_KEY: ${{ secrets.AIRBRAKE_PROJECT_KEY }}
          # Enables the mac updater; set the repo variable once builds are Developer ID signed.
          MAIN_VITE_MAC_SIGNED: ${{ vars.MAC_SIGNING_ENABLED == 'true' && 'true' || 'false' }}
          MAIN_VITE_AUTO_UPDATE: ${{ vars.AUTO_UPDATE_ENABLED == 'false' && 'false' || 'true' }}
        run: npm run build

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx electron-builder --mac \
            --publish always \
            --config.publish.releaseType=draft

  release-windows:
    name: Release Windows
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Download uv binary
        shell: pwsh
        run: |
          $tmp = "$env:TEMP\uv-win.zip"
          Invoke-WebRequest "https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip" -OutFile $tmp
          Expand-Archive -Path $tmp -DestinationPath "$env:TEMP\uv-win" -Force
          Move-Item "$env:TEMP\uv-win\uv.exe" "resources\uv-windows-x64.exe" -Force

      - name: Build
        env:
          AIRBRAKE_PROJECT_ID: ${{ secrets.AIRBRAKE_PROJECT_ID }}
          AIRBRAKE_PROJECT_KEY: ${{ secrets.AIRBRAKE_PROJECT_KEY }}
          MAIN_VITE_AUTO_UPDATE: ${{ vars.AUTO_UPDATE_ENABLED == 'false' && 'false' || 'true' }}
        run: npm run build

      - name: Package and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CSC_LINK: ${{ secrets.windows_certs }}
          # CSC_KEY_PASSWORD: ${{ secrets.windows_certs_password }}
        run: |
          npx electron-builder --win `
            --publish always `
            --config.publish.releaseType=draft
        shell: pwsh

  publish:
    name: Publish release
    needs: [prepare, release-macos, release-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
