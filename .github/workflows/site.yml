name: Site

# Tests the GitHub Pages site (docs/) only when it changes; independent of the app build.
on:
  push:
    paths: ['docs/**', 'tests/site/**', 'vitest.site.config.mts', '.github/workflows/site.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'tests/site/**', 'vitest.site.config.mts', '.github/workflows/site.yml']
  workflow_dispatch:

jobs:
  test:
    name: Test site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The lockfile only carries the macOS rollup binary (npm/cli#4828), so ignore it on Linux like the Windows build does.
      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Test
        run: npm run test:site
