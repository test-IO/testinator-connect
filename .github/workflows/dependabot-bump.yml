name: Dependabot version bump

# A merged Dependabot PR only changes dependencies, and a release needs a new version in package.json.
# Pushes made with GITHUB_TOKEN start no workflows, so Release is dispatched explicitly.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: dependabot-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump patch version
    if: github.event.head_commit.author.name == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Bump when the version is not above the latest release
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if out=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>&1); then
            latest="$out"
          elif [[ "$out" == *"release not found"* ]]; then
            latest=""
          else
            echo "$out" >&2
            exit 1
          fi
          echo "version=$(node scripts/bump-version.mjs . "$latest")" >> "$GITHUB_OUTPUT"

      - name: Commit the bump and start the release
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to $VERSION"
          git pull --rebase origin main
          git push origin main
          gh workflow run release.yml --ref main
