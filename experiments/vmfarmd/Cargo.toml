[package]
name = "testinator-vm-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
gethostname = "1.1.0"
process-wrap = { version = "10", features = ["tokio1"] }
rmcp = { version = "3.7.0", features = ["client", "server", "transport-child-process", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[[bin]]
name = "vmfarmd"
path = "src/main.rs"
